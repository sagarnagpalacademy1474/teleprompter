# Serves the teleprompter app on Cloud Run (port 8080). Included inside nginx's http {} block.

# The page and the service worker must always be fresh so updates arrive.
# Other files are loaded with ?v=BUILD, so they can be cached.
map $uri $tp_cache {
  default        "public, max-age=86400";
  /              "no-cache";
  /index.html    "no-cache";
  /sw.js         "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Cache-Control $tp_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "microphone=(self), camera=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / { try_files $uri $uri/ =404; }
}
